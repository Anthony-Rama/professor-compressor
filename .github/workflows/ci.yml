name: CI

on:
  push:
    branches: [main, qa]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install browser dependencies
        run: npm ci

      - name: Lint Python sources
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Type-check Python sources
        run: python -m mypy

      - name: Lint browser sources
        run: npm run lint

      - name: Check browser formatting
        run: npm run format:check

      - name: Compile Python sources
        run: python -m compileall -q bot.py dev_bot.py professor_compressor tests

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install browser dependencies
        run: npm ci

      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt

      - name: Audit browser dependencies
        run: npm audit --omit=dev

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run unit and integration tests with coverage
        run: python -m coverage run -m unittest discover -s tests -t . -v

      - name: Report coverage
        run: python -m coverage report

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install browser dependencies
        run: npm ci

      - name: Install browser test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium

      - name: Test browser compression and recovery
        run: npm run test:browser

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag professor-compressor:ci .

      - name: Smoke-test packaged HTTP server
        run: |
          docker run --detach --name compressor-smoke --publish 127.0.0.1:18765:8080 \
            --entrypoint python professor-compressor:ci -c \
            'from aiohttp import web; from professor_compressor.app.runtime import create_web_application; web.run_app(create_web_application(), host="0.0.0.0", port=8080, access_log=None)'
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:18765/healthz
          # This HTTP-only process must not claim that Discord is ready.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/readyz)" = 503
          curl --fail --silent --show-error --head http://127.0.0.1:18765/
          for path in guide/compress-video-for-discord robots.txt sitemap.xml googlec910ef324dae35ac.html privacy terms brand/professor-compressor.png brand/compressor.js brand/compressor-view.js brand/batch-controller.js brand/shared.js brand/prepared-downloads.js brand/delivery-status.js brand/file-selection.js brand/relay-client.js brand/video-encoder.js brand/third-party-notices.txt brand/COPYING.GPLv2 assets/core-esm/ffmpeg-core.wasm assets/core-mt-esm/ffmpeg-core.wasm; do
            curl --fail --silent --show-error --head "http://127.0.0.1:18765/$path"
          done

      - name: Verify diagnostic storage survives container recreation
        run: |
          docker volume create compressor-diagnostics-smoke
          for phase in seed verify; do
            docker run --rm --network none --env PYTHONPATH=/app \
              --mount type=volume,src=compressor-diagnostics-smoke,dst=/data/observability \
              --mount type=bind,src="$PWD/tests/harness/container_observability.py",dst=/verification/smoke.py,readonly \
              --entrypoint python professor-compressor:ci /verification/smoke.py "$phase"
          done

      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs compressor-smoke || true
          docker rm --force compressor-smoke || true
          docker volume rm compressor-diagnostics-smoke || true
