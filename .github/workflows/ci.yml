name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install browser dependencies
        run: npm ci

      - name: Lint Python sources
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q bot.py professor_compressor tests

      - name: Audit browser dependencies
        run: npm audit --omit=dev

      - name: Install browser test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium

      - name: Test browser compression and recovery
        run: npm run test:browser

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag professor-compressor:ci .

      - name: Smoke-test packaged HTTP server
        run: |
          docker run --detach --name compressor-smoke --publish 127.0.0.1:18765:8080 \
            --entrypoint python professor-compressor:ci -c \
            'from aiohttp import web; from professor_compressor.application import create_web_application; web.run_app(create_web_application(), host="0.0.0.0", port=8080, access_log=None)'
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:18765/healthz
          for path in privacy terms brand/professor-compressor.png brand/third-party-notices.txt brand/COPYING.GPLv2 assets/core-esm/ffmpeg-core.wasm assets/core-mt-esm/ffmpeg-core.wasm; do
            curl --fail --silent --show-error --head "http://127.0.0.1:18765/$path"
          done

      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs compressor-smoke || true
          docker rm --force compressor-smoke || true
