services:
  bot:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-development}
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      PUBLIC_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      OBSERVABILITY_DB_PATH: ${OBSERVABILITY_DB_PATH:-}
    volumes:
      - diagnostics_data:/data/observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8080"
    mem_limit: 1g
    stop_grace_period: 150s

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  diagnostics_data:
