[project]
name = "professor-compressor"
version = "1.0.0"
description = "Privacy-focused Discord video compression using FFmpeg WebAssembly"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"professor_compressor/web/pages/legal.py" = ["RUF001"]
# Embedded dashboard markup and parameterized SQL contain long literal lines.
"professor_compressor/observability/dashboard.py" = ["E501"]
"professor_compressor/observability/store.py" = ["E501"]
"professor_compressor/observability/queries.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["bot.py", "dev_bot.py", "professor_compressor", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["professor_compressor"]
branch = true

[tool.coverage.report]
skip_empty = true
precision = 1
