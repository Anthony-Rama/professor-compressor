<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  __THEME_BOOT__
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>__TITLE__</title>
  <link rel="icon" type="image/png" href="/brand/professor-compressor.png">
  <link rel="apple-touch-icon" href="/brand/professor-compressor.png">
  <style>
__THEME_CSS__
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between;
              gap: 12px; min-height: 61px;
              padding: 12px max(20px, calc((100% - 1184px) / 2));
              border-bottom: 1px solid var(--border); }
    .session-note { display: inline-flex; align-items: center; gap: 6px; min-width: 0;
                    padding: 6px 12px; border-radius: 999px; background: var(--raised);
                    color: var(--text-soft); font-size: 12px; font-weight: 600;
                    white-space: nowrap; }
    .session-note .icon { width: 14px; height: 14px; }
    .compressor-topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; }
    .compressor-topbar .brandmark { justify-self: start; white-space: normal; }
    .compressor-topbar .theme-menu { grid-column: 3; grid-row: 1; }
    main { width: min(100% - 40px, 560px); margin: 0 auto; padding: 28px 0 40px; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 32px); line-height: 1.15;
         font-weight: 800; letter-spacing: -.02em; }
    p { margin: 0; }
    .intro { margin-top: 8px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .page-footer { display: flex; flex-wrap: wrap; align-items: center;
                   justify-content: center; gap: 8px 16px; padding: 12px 20px 20px;
                   border-top: 1px solid var(--border); color: var(--faint);
                   font-size: 13px; text-align: center; }
    .session-footer { padding: 13px 20px; }
    main.compressor + .session-footer { margin-top: auto; }
    .session-footer nav { display: flex; flex-wrap: wrap; align-items: center;
                          justify-content: center; gap: 4px 22px; }
    .session-footer a { display: inline-flex; align-items: center; gap: 6px;
                        color: var(--muted); padding: 5px 0; text-decoration: none; }
    .session-footer a span { text-decoration: underline; text-underline-offset: 3px; }
    .session-footer a svg { flex: none; width: 14px; height: 14px; }
    .session-footer a:hover, .session-footer a:focus-visible { color: var(--text); }
    .message { padding: 13px 14px; border: 1px solid var(--border); border-radius: 14px;
               background: var(--surface); color: var(--text); font-size: 14px;
               line-height: 1.45; }
    .message.error { border-color: var(--danger-border); background: var(--danger-surface); }
    .message.error::before, .message.success::before {
      content: ""; display: inline-block; width: 16px; height: 16px; margin: 0 8px -3px 0;
      background: currentColor; -webkit-mask: var(--icon) center / contain no-repeat;
      mask: var(--icon) center / contain no-repeat; }
    .message.error::before { --icon: var(--i-alert); color: var(--danger); }
    .message.success { border-color: var(--success-border); background: var(--success-tint);
                       text-align: center; }
    .message.success::before { --icon: var(--i-check); color: var(--success); }
    .selection.error { color: var(--danger); }
    .notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px;
              border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
              color: var(--text-soft); font-size: 14px; line-height: 1.45; }
    .notice > .icon { width: 22px; height: 22px; margin-top: 1px; }
    .notice strong { color: var(--text); }
    :is(.support-actions, #feedback-actions) { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    :is(.support-actions, #feedback-actions) a { display: inline-flex; flex: 1 1 0; align-items: center;
                         justify-content: center; gap: 8px; min-width: 0; min-height: 44px;
                         padding: 0 12px; border: 1px solid var(--border-strong);
                         border-radius: 12px; color: var(--text); font-size: 14px;
                         font-weight: 600; text-decoration: none; }
    :is(.support-actions, #feedback-actions) a:hover { background: var(--raised); color: var(--text); }
    :is(.support-actions, #feedback-actions) .btn-primary { flex-basis: 100%; min-height: 52px; border-color: transparent;
                                    background: var(--accent); color: var(--on-accent);
                                    font-size: 16px; border-radius: 14px; }
    :is(.support-actions, #feedback-actions) .btn-primary:hover { background: var(--accent-hover); color: var(--on-accent); }
    :is(.support-actions, #feedback-actions) p { flex-basis: 100%; color: var(--faint); font-size: 12px;
                         text-align: center; }
    .review-card { display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
                   padding: 14px 16px; border: 1px solid var(--border-strong);
                   border-radius: 16px; background: var(--accent-tint); }
    .review-card > .icon { width: 22px; height: 22px; color: var(--warning); }
    .review-card p { flex: 1 1 180px; min-width: 0; color: var(--text); font-size: 14px;
                     line-height: 1.4; }
    .review-card a { display: inline-flex; align-items: center; min-height: 44px;
                     padding: 0 14px; border: 1px solid var(--accent-border);
                     border-radius: 12px; color: var(--text); font-size: 14px;
                     font-weight: 600; text-decoration: none; }
    .review-card a:hover { background: var(--surface); }

    /* Compressor workspace */
    main.compressor { width: min(100% - 40px, 1184px); padding-top: 24px; }
    .page-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .page-head .intro { margin: 0; }
    .page-head:focus-within h1 { outline: none; }
    #page-heading:focus { outline: none; }
    .recovery-notice { margin-bottom: 8px; text-align: left; }
    .start-steps { display: flex; gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; }
    .start-steps li { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0;
                      padding: 10px; border: 1px solid var(--border); border-radius: 12px;
                      background: var(--surface); color: var(--muted); font-size: 13px;
                      font-weight: 600; }
    .start-steps li span { display: grid; place-items: center; width: 22px; height: 22px;
                           flex: none; border-radius: 999px; background: var(--border);
                           color: var(--text); font-size: 12px; }
    .start-steps li[aria-current] { border-color: var(--accent); background: var(--accent-tint);
                                    color: var(--text); }
    .start-steps li[aria-current] span { background: var(--accent); color: var(--on-accent); }
    main:has(.file-card) .start-steps, main.processing-view .start-steps,
    main:has(#startup-error:not([hidden])) .start-steps { display: none; }
    body:has(#startup-error:not([hidden])) .session-note { display: none; }
    .startup-error { width: 100%; max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; align-items: center; gap: 14px;
                     margin-bottom: 20px; padding: 28px 20px; border: 1px solid var(--danger-border);
                     border-radius: 20px; background: var(--danger-surface); text-align: center; }
    .startup-error h2 { margin: 0; font-size: 22px; line-height: 1.2; }
    .startup-error p { color: var(--text-soft); font-size: 15px; }
    .startup-visual { display: grid; place-items: center; width: 72px; height: 72px;
                      border-radius: 20px; background: var(--danger-tint); color: var(--danger); }
    .startup-visual .icon { width: 34px; height: 34px; }
    .startup-error .support-actions { width: 100%; }
    main:has(#startup-error:not([hidden])) :is(#upload, #page-intro, .recovery-notice, #stay-open) {
      display: none; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 40px;
                 align-items: start; }
    .col-main, .col-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .file-input { position: absolute; width: 1px; height: 1px; padding: 0;
                  margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0);
                  white-space: nowrap; border: 0; }
    .picker-row { display: flex; gap: 10px; align-items: stretch; }
    .file-picker { display: flex; flex: 1; flex-direction: column; align-items: center;
                   gap: 14px; min-width: 0; padding: 32px 20px;
                   border: 2px dashed var(--border-strong); border-radius: 20px;
                   background: var(--surface-2); text-align: center; cursor: pointer; }
    .file-picker:hover { border-color: var(--accent-fill); }
    .file-picker.drag-over { border-color: var(--accent-fill); background: var(--accent-tint); }
    .file-input:focus + .file-picker { outline: 3px solid var(--focus); outline-offset: 2px; }
    .picker-icon { display: grid; place-items: center; width: 64px; height: 64px; flex: none;
                   border-radius: 18px; background: var(--accent-tint); color: var(--accent-text); }
    .picker-icon .icon { width: 32px; height: 32px; }
    .picker-text { display: flex; flex: 1 1 auto; min-width: 0; flex-direction: column; gap: 4px; }
    .picker-text strong { font-size: 19px; font-weight: 700; }
    .picker-text small { color: var(--muted); font-size: 14px; }
    .picker-button { display: inline-flex; align-items: center; justify-content: center;
                     min-height: 48px; padding: 0 24px; border-radius: 14px;
                     background: var(--accent); color: var(--on-accent); font-size: 16px;
                     font-weight: 600; white-space: nowrap; flex: none; }
    .file-picker:hover .picker-button { background: var(--accent-hover); }
    .when-filled { display: none; }
    #upload:has(.file-card) .when-empty { display: none; }
    #upload:has(.file-card) .when-filled { display: inline; }
    #upload:has(.file-card) .file-picker { flex-direction: row; gap: 16px; padding: 16px 20px;
                                          border-radius: 18px; text-align: left; }
    #upload:has(.file-card) .picker-icon { width: 48px; height: 48px; border-radius: 14px; }
    #upload:has(.file-card) .picker-icon .icon { width: 24px; height: 24px; }
    #upload:has(.file-card) .picker-text strong { font-size: 16px; }
    #upload:has(.file-card) .picker-button { min-height: 44px; padding: 0 18px;
                                            border: 1px solid var(--border-strong);
                                            background: var(--surface); color: var(--text);
                                            font-size: 14px; }
    .clear-selection { display: grid; flex: 0 0 56px; place-items: center; width: 56px;
                       margin: 0; padding: 0; border-radius: 18px; cursor: pointer; }
    .clear-selection:disabled { opacity: .45; cursor: not-allowed; }
    .selection { color: var(--muted); font-size: 13px; }
    #preparation-help { color: var(--faint); font-size: 12px; }
    #upload:not(:has(.file-card)) #preparation-help { display: none; }
    .file-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .file-card { width: 100%; min-width: 0; display: grid;
                 grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center;
                 column-gap: 12px; row-gap: 10px; padding: 12px;
                 border: 1px solid var(--border); border-radius: 16px;
                 background: var(--surface); }
    .file-icon { display: grid; place-items: center; width: 48px; height: 48px;
                 border-radius: 10px; background: var(--accent-tint); color: var(--accent-text); }
    .file-icon .icon { width: 22px; height: 22px; }
    .file-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .file-name { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; font-size: 14px; font-weight: 600; }
    .file-line { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px;
                 min-width: 0; font-size: 13px; }
    .file-status { display: inline-flex; align-items: center; gap: 5px;
                   color: var(--text-soft); font-weight: 600; }
    .file-status::before { content: ""; display: none; width: 14px; height: 14px; flex: none;
                           align-self: center; background: currentColor;
                           -webkit-mask: var(--icon) center / contain no-repeat;
                           mask: var(--icon) center / contain no-repeat; }
    .file-meta { min-width: 0; color: var(--faint); font-weight: 500; }
    .file-meta::before { content: "· "; }
    .file-card progress { grid-column: 1 / -1; height: 6px; }
    .remove-file { display: grid; place-items: center; width: 44px; height: 44px; margin: 0;
                   padding: 0; border: 0; border-radius: 12px; background: transparent;
                   color: var(--faint); cursor: pointer; }
    .remove-file:is(:hover, :focus-visible) { background: var(--danger-tint);
                                              color: var(--danger); }
    .remove-file .icon { width: 20px; height: 20px; }
    .reselect-file { grid-column: 1 / -1; min-height: 44px; margin: 0; border: 0;
                     border-radius: 12px; background: var(--danger-tint); color: var(--text);
                     font: 600 14px var(--font); cursor: pointer; }
    .reselect-file:disabled { opacity: .55; cursor: not-allowed; }
    .file-card[data-status="ready"] .file-status,
    .file-card[data-status="done"] .file-status { color: var(--success); }
    .file-card[data-status="ready"] .file-status::before,
    .file-card[data-status="done"] .file-status::before { display: block; --icon: var(--i-check); }
    .file-card[data-status="attention"] { border-color: var(--danger-border);
                                          background: var(--danger-surface); }
    .file-card[data-status="attention"] .file-icon { background: var(--danger-tint);
                                                     color: var(--danger); }
    .file-card[data-status="attention"] .file-status { color: var(--danger); }
    .file-card[data-status="attention"] .file-status::before { display: block;
                                                               --icon: var(--i-alert); }
    .file-card[data-status="attention"] .file-meta { flex-basis: 100%; color: var(--danger-text);
                                                     line-height: 1.45; }
    .file-card[data-status="attention"] .file-meta::before { content: none; }
    .file-card[data-status="done"] .file-icon { background: var(--success-tint);
                                                color: var(--success); }
    .file-card[data-status="attention"] .file-icon .icon { --icon: var(--i-alert); }
    .file-card[data-status="done"] .file-icon .icon { --icon: var(--i-check); }
    .file-card:is([data-status="done"], [data-status="working"]) .file-meta { flex-basis: 100%; }
    .file-card:is([data-status="done"], [data-status="working"]) .file-meta::before {
      content: none; }
    .file-card[data-status="working"] .file-status { color: var(--accent-text); }
    .file-card[data-status="stopped"] .file-status { color: var(--muted); }
    .file-card[data-status="stopped"] .file-status::before { display: block;
                                                             --icon: var(--i-info); }
    .file-card:is([data-status="ready"], [data-status="attention"], [data-status="done"],
                  [data-status="stopped"]) progress,
    .completed .file-card progress { display: none; }
    progress { display: block; width: 100%; height: 10px; overflow: hidden; border: 0;
               border-radius: 999px; background: var(--track); color: var(--accent-fill);
               accent-color: var(--accent-fill); -webkit-appearance: none; appearance: none; }
    progress::-webkit-progress-bar { background: var(--track); border-radius: 999px; }
    progress::-webkit-progress-value { background: var(--accent-fill); border-radius: 999px; }
    progress::-moz-progress-bar { background: var(--accent-fill); border-radius: 999px; }
    .stay-open { margin-bottom: 20px; }
    .stay-open > .icon { color: var(--warning); }
    .stay-open > .device-large { display: none; }
    @media (min-width: 768px) {
      .stay-open > .device-small { display: none; }
      .stay-open > .device-large { display: block; }
    }
    .processing-view .stay-open { border-color: var(--warning-border);
                                  background: var(--warning-tint); color: var(--warning-text); }
    .processing-view .stay-open strong { color: var(--warning-text); }
    .work { display: flex; flex-direction: column; gap: 16px; }
    .background-warning { padding: 12px 14px; border: 1px solid var(--warning-border);
                          border-radius: 14px; background: var(--warning-tint);
                          color: var(--warning-text); font-size: 13px; line-height: 1.45; }
    .phase-panel { display: flex; flex-direction: column; gap: 10px; padding: 20px;
                   border: 1px solid var(--border); border-radius: 20px;
                   background: var(--surface); }
    .step-label { color: var(--accent-text); font-size: 13px; font-weight: 600; }
    .phase-title { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 800;
                   letter-spacing: -.02em; }
    .phase-copy { color: var(--muted); font-size: 14px; }
    .run-meta { display: flex; justify-content: space-between; gap: 12px;
                color: var(--text-soft); font-size: 13px; }
    .phase-track { display: flex; flex-direction: column; margin: 0; padding: 0 4px;
                   list-style: none; }
    .phase-step { position: relative; display: flex; gap: 12px; padding-bottom: 18px;
                  color: var(--muted); font-size: 15px; font-weight: 600; }
    .phase-step:last-child { padding-bottom: 0; }
    .phase-step:not(:last-child)::after { content: ""; position: absolute; top: 30px;
                                          bottom: 4px; left: 12px; width: 2px;
                                          background: var(--border); }
    .phase-step.done:not(:last-child)::after { background: var(--success-border); }
    .step-marker { position: relative; display: grid; place-items: center; width: 26px;
                   height: 26px; flex: none; border: 2px solid var(--border-strong);
                   border-radius: 999px; }
    .phase-step.active { color: var(--text); font-weight: 700; }
    .phase-step.active .step-marker { border-color: var(--accent-fill); }
    .phase-step.active .step-marker::after { content: ""; width: 10px; height: 10px;
                                             border-radius: 999px;
                                             background: var(--accent-fill); }
    .phase-step.done { color: var(--text); }
    .phase-step.halted { color: var(--text); font-weight: 700; }
    .phase-step.halted .step-marker { border-color: var(--warning); color: var(--warning); }
    .phase-step.halted .step-marker::after { content: ""; width: 14px; height: 14px;
                                             --icon: var(--i-alert); background: currentColor;
                                             -webkit-mask: var(--icon) center / contain no-repeat;
                                             mask: var(--icon) center / contain no-repeat; }
    .phase-step.done .step-marker { border-color: var(--success-tint);
                                    background: var(--success-tint); color: var(--success); }
    .phase-step.done .step-marker::after { content: ""; width: 14px; height: 14px;
                                           --icon: var(--i-check);
                                           background: currentColor;
                                           -webkit-mask: var(--icon) center / contain no-repeat;
                                           mask: var(--icon) center / contain no-repeat; }
    .step-text { display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
    .step-note { display: none; color: var(--muted); font-size: 13px; font-weight: 500; }
    .phase-step.active .step-note { display: block; }
    .completion-summary { color: var(--success); font-size: 14px; font-weight: 600;
                          text-align: center; }
    .size-summary { color: var(--muted); font-size: 13px; text-align: center; }
    .send-panel { display: flex; flex-direction: column; gap: 12px; padding: 24px;
                  border: 1px solid var(--border); border-radius: 20px;
                  background: var(--surface); }
    .caption-label { font-size: 14px; font-weight: 600; }
    .caption-label .optional { color: var(--faint); font-weight: 500; }
    #caption { display: block; width: 100%; min-height: 76px; margin-top: -4px;
               padding: 12px 14px; resize: vertical; border: 1px solid var(--control-border);
               border-radius: 14px; background: var(--surface-2); color: var(--text);
               font: 400 15px/1.4 var(--font); }
    #caption::placeholder { color: var(--faint); }
    #caption:disabled { opacity: .6; }
    .caption-help { margin-top: -4px; color: var(--faint); font-size: 12px; text-align: right; }
    .controls { display: flex; flex-direction: column; gap: 10px; }
    .controls.is-empty { display: none; }
    #submit, #cancel { width: 100%; min-height: 52px; margin: 0; border-radius: 14px;
                       font: 600 16px/1.2 var(--font); cursor: pointer; }
    #submit { border: 0; background: var(--accent); color: var(--on-accent); }
    #submit:hover:not(:disabled) { background: var(--accent-hover); }
    #submit:disabled { background: var(--disabled-bg); color: var(--disabled-text);
                       cursor: not-allowed; }
    #cancel, .clear-selection { border: 1px solid var(--danger-border);
                                background: var(--danger-surface); color: var(--danger); }
    #cancel:hover:not(:disabled), .clear-selection:hover:not(:disabled) {
      background: var(--danger-tint);
    }
    #cancel:disabled { opacity: .55; cursor: not-allowed; }
    .submit-help { color: var(--text-soft); font-size: 13px; text-align: center; }
    .submit-help:empty { display: none; }
    #downloads { display: flex; flex-direction: column; gap: 8px; }
    #downloads p { color: var(--text-soft); font-size: 14px; }
    .download-link { display: flex; align-items: center; justify-content: space-between;
                     gap: 12px; min-height: 48px; padding: 0 14px;
                     border: 1px solid var(--border); border-radius: 14px;
                     background: var(--surface); color: var(--text); font-size: 14px;
                     font-weight: 600; text-decoration: none; }
    .download-link:hover { background: var(--raised); color: var(--text); }
    .download-link span { min-width: 0; overflow: hidden; text-overflow: ellipsis;
                          white-space: nowrap; }
    .download-link .icon { color: var(--accent-text); }
    .completed #feedback-actions { display: none; }
    #message.success, #delivery-status.success { white-space: pre-line; }
    .next-steps { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0 8px;
                  color: var(--text-soft); font-size: 14px; list-style: none;
                  counter-reset: next; }
    .next-steps li { display: flex; gap: 10px; counter-increment: next; }
    .next-steps li::before { content: counter(next); display: grid; place-items: center;
                             width: 22px; height: 22px; flex: none; border-radius: 999px;
                             background: var(--border); color: var(--text); font-size: 12px;
                             font-weight: 700; }
    .performance-help { padding: 14px 16px; border: 1px solid var(--border);
                        border-radius: 14px; background: var(--surface);
                        color: var(--muted); font-size: 13px; }
    .performance-help summary { color: var(--text); font-size: 14px; font-weight: 600;
                                cursor: pointer; }
    .performance-help p { margin-top: 10px; }
    .performance-help code { color: var(--accent-text); overflow-wrap: anywhere; }
    .privacy { color: var(--faint); font-size: 13px; text-align: center; }
    .privacy .icon { width: 13px; height: 13px; margin: 0 4px -2px 0; }
    .compressor .privacy { text-align: left; }
    .completed .privacy { display: none; }
    .processing .next-steps, .completed .next-steps {
      display: none; }
    main.processing-view, main:has(> #upload.completed) { width: min(100% - 40px, 640px); }
    .processing.workspace, .completed.workspace { grid-template-columns: minmax(0, 1fr);
                                                  gap: 16px; }
    .processing .send-panel, .completed .send-panel { padding: 0; border: 0;
                                                      background: none; }
    main:has(> #upload.completed) .page-head { align-items: center; text-align: center; }
    .done-mark { display: none; }
    main:has(> #upload.completed) .done-mark { display: grid; place-items: center;
                                              width: 76px; height: 76px; margin: 0 auto 6px;
                                              border-radius: 999px; background: var(--success-tint);
                                              color: var(--success); }
    main:has(> #upload.completed) .done-mark .icon { width: 38px; height: 38px; }

    /* Single-column compressor: the workspace becomes one list with a pinned action bar. */
    @media (max-width: 959px) {
      main.compressor { width: min(100% - 40px, 560px); }
      .workspace { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
      .col-main, .col-side, .send-panel { display: contents; }
      .next-steps { display: none; }
      .controls { position: sticky; bottom: 0; z-index: 2; margin: 0 -20px;
                  padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
                  border-top: 1px solid var(--border); background: var(--bg); }
      .caption-label { margin-top: 4px; }
      html:has(.controls:not(.is-empty)) { scroll-padding-bottom: 130px; }
    }
    @media (max-width: 680px) {
      .compressor-topbar { grid-template-columns: minmax(0, 1fr) auto; }
      .compressor-topbar .session-note { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
      .compressor-topbar .theme-menu { grid-column: 2; }
    }
    @media (max-width: 430px) {
      .topbar .brandmark { font-size: 14px; gap: 8px; }
    }
    @media (max-width: 520px) {
      #upload:has(.file-card) .picker-button { display: none; }
      #upload:has(.file-card) .file-picker { padding: 12px 16px; gap: 12px; }
      #upload:has(.file-card) .picker-text small { display: none; }
      #upload:has(.file-card) .picker-icon { width: 40px; height: 40px; border-radius: 12px; }
      #upload:has(.file-card) .clear-selection { flex-basis: 52px; width: 52px;
                                                border-radius: 14px; }
      .start-steps li { flex-direction: column; text-align: center; }
      .session-label { display: none; }
    }

    /* Status and link pages */
    main.status-page { display: flex; flex-direction: column; gap: 20px; margin-block: auto;
                       padding-block: 40px; }
    .status-hero { display: flex; flex-direction: column; align-items: center; gap: 14px;
                   text-align: center; }
    .status-hero .intro { margin: 0; max-width: 420px; }
    .status-visual { display: grid; place-items: center; width: 72px; height: 72px;
                     border-radius: 20px; background: var(--accent-tint);
                     color: var(--accent-text); }
    .status-visual .icon { width: 34px; height: 34px; --icon: var(--state-icon); }
    .status-page:is([data-state="checking"], [data-state="pending"], [data-state="retrying"])
      .status-visual { border: 5px solid var(--track); border-top-color: var(--accent-fill);
                       border-radius: 999px; background: none; }
    .status-page:is([data-state="checking"], [data-state="pending"], [data-state="retrying"])
      .status-visual .icon { display: none; }
    @media (prefers-reduced-motion: no-preference) {
      .status-page:is([data-state="checking"], [data-state="pending"], [data-state="retrying"])
        .status-visual { animation: spin 1.1s linear infinite; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-page[data-state="delivered"] .status-visual { border-radius: 999px;
                                                         background: var(--success-tint);
                                                         color: var(--success); }
    .status-page[data-state="delivered"] { --state-icon: var(--i-check); }
    .status-page:is([data-state="stalled"], [data-state="unconfirmed"], [data-state="wait"],
                    [data-state="unavailable"])
      .status-visual { background: var(--warning-tint); color: var(--warning); }
    .status-page:is([data-state="stalled"], [data-state="unconfirmed"]) {
      --state-icon: var(--i-warning); }
    .status-page[data-state="failed"] .status-visual { background: var(--danger-tint);
                                                      color: var(--danger); }
    .status-page[data-state="failed"] { --state-icon: var(--i-failed); }
    .status-page[data-state="interrupted"] { --state-icon: var(--i-refresh); }
    .status-page[data-state="unavailable"] { --state-icon: var(--i-info); }
    .status-page[data-state="maintenance"] { --state-icon: var(--i-tools); }
    .status-page[data-state="link"] { --state-icon: var(--i-link-off); }
    .countdown { display: grid; place-items: center; width: 96px; height: 96px;
                 border: 6px solid var(--track); border-top-color: var(--warning);
                 border-right-color: var(--warning); border-radius: 999px;
                 font-size: 26px; font-weight: 800; }
    .status-note { display: none; }
    .status-page:is([data-state="checking"], [data-state="pending"], [data-state="retrying"])
      .note-checking,
    .status-page[data-state="stalled"] .note-stalled { display: flex; }
    #delivery-status:not(.success):not(.error) { text-align: center; }
    #check-again { width: 100%; }
    .reference { color: var(--faint); font-size: 12px; text-align: center; }
    #reselect { display: flex; flex-direction: column; gap: 14px; }
    #reselect[hidden] { display: none; }
    #reselect p { color: var(--text-soft); font-size: 15px; text-align: center; }
    #delivery-page .status-support { display: none; }
    #delivery-page:is([data-state="stalled"], [data-state="failed"], [data-state="unconfirmed"],
                      [data-state="unavailable"])
      .status-support { display: flex; }
    .steps-card { display: flex; flex-direction: column; gap: 10px; }
    .steps-card strong { font-size: 15px; }
    .steps-card ol { display: flex; flex-direction: column; gap: 8px; margin: 0;
                     padding-left: 20px; color: var(--text-soft); font-size: 14px;
                     line-height: 1.45; }
    .page-actions { display: flex; flex-direction: column; align-items: stretch; gap: 14px;
                    text-align: center; font-size: 14px; }
  </style>
